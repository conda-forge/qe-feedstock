schema_version: 1

context:
  name: "qe"
  version: "7.6"
  mpi_prefix: "mpi_${{ mpi }}"
  # Prefer the openmpi variant by default
  build_number: ${{ 4 + (100 if mpi == "openmpi" else 0) }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/QEF/q-e/archive/${{ name }}-${{ version }}.tar.gz
  sha256: "945c8f16ab330c8f0b30f4de1a9a088b85038476fcd819394e641f4d2d8b7d51"

build:
  number: ${{ build_number }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build_number }}
  skip: win
  dynamic_linking:
    overlinking_behavior: error

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('fortran') }}
    - ${{ mpi }}
    - cmake >=3.18.0
    - make
    - pkg-config
    - wget
  host:
    - ${{ mpi }}
    - if: linux
      then: _openmp_mutex * *_llvm
    - if: osx
      then: llvm-openmp
    - "elpa >=2026.02.002 *${{ mpi_prefix }}_*"
    - fftw
    - "hdf5 * *${{ mpi_prefix }}_*"
    - libblas
    - liblapack
    # - libxc
    - scalapack
    - zlib
  run:
    - if: linux
      then: _openmp_mutex
    - ${{ pin_compatible("elpa", upper_bound="x.x.x", build=mpi_prefix ~ "_*") }}

tests:
  # Check that all shared libraries needed by the binaries are provided
  # by the run dependencies
  - script:
      - if: linux and target_platform == build_platform
        then:
          - |
            rc=0
            for f in ${PREFIX}/bin/*.x; do
              if ldd "$f" | grep -q "not found"; then
                echo "Missing libraries for $f:"; ldd "$f" | grep "not found"; rc=1
              fi
            done
            exit $rc
  - package_contents:
      bin:
        - alpha2f.x
        - average.x
        - bands.x
        - cell2ibrav.x
        - cppp.x
        - cp.x
        - dos.x
        - dvscf_q2r.x
        - dynmat.x
        - epa.x
        - epsilon.x
        - ev.x
        - fermi_proj.x
        - fermi_velocity.x
        - fqha.x
        - fs.x
        - ibrav2cell.x
        - initial_state.x
        - kpoints.x
        - lambda.x
        - ld1.x
        - manycp.x
        - matdyn.x
        - molecularpdos.x
        - neb.x
        - open_grid.x
        - path_interpolation.x
        - pawplot.x
        - phcg.x
        - ph.x
        - plan_avg.x
        - plotband.x
        - plotproj.x
        - plotrho.x
        - pmw.x
        - postahc.x
        - ppacf.x
        - pp.x
        - projwfc.x
        - pw2bgw.x
        - pw2critic.x
        - pw2gw.x
        - pw2wannier90.x
        - pwcond.x
        - pwi2xsf.x
        - pw.x
        - q2qstar.x
        - q2r.x
        - scan_ibrav.x
        - sumpdos.x
        - upfconv.x
        - virtual_v2.x
        - wannier_ham.x
        - wannier_plot.x
        - wfck2r.x
        - wfdd.x

about:
  license: GPL-2.0-only
  license_file: License
  summary: QUANTUM ESPRESSO (opEn-Source Package for Research in Electronic Structure, Simulation, and Optimization)
  description: |
    QUANTUM ESPRESSO is an integrated suite of Open-Source computer
    codes for electronic-structure calculations and materials modeling
    at the nanoscale. It is based on density-functional theory, plane
    waves, and pseudopotentials.
  homepage: https://www.quantum-espresso.org
  repository: https://github.com/QEF/q-e
  documentation: https://www.quantum-espresso.org/Doc/user_guide/

extra:
  recipe-maintainers:
    - jan-janssen
    - certik
    - wolfv
    - ltalirz
    - unkcpz
    - mkrack
